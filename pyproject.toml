[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gen-art"
version = "0.1.0"
description = "Reproducible generative art in Python."
requires-python = ">=3.13"
dependencies = [
    "imageio-ffmpeg>=0.6",
    "numpy>=2.0",
    "Pillow>=10.0",
]

[project.scripts]
gen-art = "gen_art.render:main"
gen-art-animate = "gen_art.animate:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]